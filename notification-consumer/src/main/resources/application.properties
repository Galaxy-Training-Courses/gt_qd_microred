# consume `loan-events` y registra un log JSON. F7 agrega
# quarkus-smallrye-health, que sí trae servidor HTTP: puerto
# propio 8083, libre frente a community-service 8081 y loan-service 8082.
quarkus.http.port=8083
quarkus.application.name=notification-consumer

# logs estructurados en JSON. `requestId` (del evento)
# viaja por MDC en LoanEventConsumer.
quarkus.log.console.json.additional-field.service.value=notification-consumer
# Se quitan del JSON los metadatos que no aportan para seguir una
# operacion (contador interno, clase fachada del logger, NDC vacio, datos
# del proceso); se conservan timestamp, level, loggerName, threadName,
# hostName, message, mdc y service.
quarkus.log.console.json.excluded-keys=sequence,loggerClassName,ndc,processName,processId,threadId

# Sin bootstrap.servers en %dev/%test: Kafka Dev Services lo levanta solo.
# %prod usa Redpanda por variable de entorno,
# mismo criterio que DATABASE_URL/COMMUNITY_SERVICE_URL en los otros módulos.
mp.messaging.incoming.loan-events.connector=smallrye-kafka
mp.messaging.incoming.loan-events.topic=loan-events
mp.messaging.incoming.loan-events.group.id=notification-consumer
mp.messaging.incoming.loan-events.key.deserializer=org.apache.kafka.common.serialization.LongDeserializer
mp.messaging.incoming.loan-events.value.deserializer=pe.edu.galaxy.training.java.quarkus.notification.LoanEventDeserializer

%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
