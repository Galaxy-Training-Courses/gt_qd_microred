scripts:
  - type: afterResponse
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test('status AVAILABLE', () => pm.expect(body.status).to.eql('AVAILABLE'));
      pm.collectionVariables.set('objectId', body.id);
