# Sistema completo —
# - Dos PostgreSQL (una base lógica por servicio)
# - Redpanda
# - Tres servicios Quarkus, construidos desde sus src/main/docker/Dockerfile.jvm
services:
  postgres-community:
    image: postgres:17
    environment:
      POSTGRES_DB: community_db
      POSTGRES_USER: ${POSTGRES_COMMUNITY_USER}
      POSTGRES_PASSWORD: ${POSTGRES_COMMUNITY_PASSWORD}
    ports:
      # Se remapea a 5434 en el host para no entrar en conflicto
      # con el PostgreSQL 16 nativo; el puerto interno de
      # Compose (5432) no cambia.
      - "5434:5432"
    volumes:
      - postgres_community_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community -d community_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-loan:
    image: postgres:17
    environment:
      POSTGRES_DB: loan_db
      POSTGRES_USER: ${POSTGRES_LOAN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_LOAN_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_loan_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loan -d loan_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redpanda como broker Kafka-compatible en Compose (Dev Services solo en %dev/%test).
  # Un solo nodo, sin listener externo: nada fuera de esta red necesita hablarle directo.
  redpanda:
    image: redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:\\s+true'"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  community-service:
    build:
      context: ./community-service
      dockerfile: src/main/docker/Dockerfile.jvm
    image: community-service:jvm
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres-community:5432/community_db
      DATABASE_USER: ${POSTGRES_COMMUNITY_USER}
      DATABASE_PASSWORD: ${POSTGRES_COMMUNITY_PASSWORD}
    depends_on:
      postgres-community:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  loan-service:
    build:
      context: ./loan-service
      dockerfile: src/main/docker/Dockerfile.jvm
    image: loan-service:jvm
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres-loan:5432/loan_db
      DATABASE_USER: ${POSTGRES_LOAN_USER}
      DATABASE_PASSWORD: ${POSTGRES_LOAN_PASSWORD}
      COMMUNITY_SERVICE_URL: http://community-service:8081
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      postgres-loan:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      community-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  notification-consumer:
    build:
      context: ./notification-consumer
      dockerfile: src/main/docker/Dockerfile.jvm
    image: notification-consumer:jvm
    ports:
      - "8083:8083"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_community_data:
  postgres_loan_data:
