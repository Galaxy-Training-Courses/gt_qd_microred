quarkus.http.port=8081
quarkus.application.name=community-service

# El esquema lo crea Flyway, no Hibernate: 'validate' solo compara, nunca genera ni destruye.
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=true

quarkus.flyway.migrate-at-start=true

# %dev y %test cargan además el seed determinista (db/seed)
# %prod solo corre db/migration
%dev.quarkus.flyway.locations=db/migration,db/seed
%test.quarkus.flyway.locations=db/migration,db/seed

# Sin datasource configurado en %dev/%test a propósito: Dev Services sigue
# %prod: cero credenciales literales. Todo por variable de entorno.
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL}
%prod.quarkus.datasource.username=${DATABASE_USER}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD}

# Tamaño de página por defecto
microred.community.pagination.default-size=10

# Logs estructurados en JSON. `service` es estático;
# `requestId` (RequestIdFilter) viaja por MDC.
quarkus.log.console.json.additional-field.service.value=community-service

# Quitar metadatos innecesarios en el pintado de logs
quarkus.log.console.json.excluded-keys=sequence,loggerClassName,ndc,processName,processId,threadId

quarkus.native.additional-build-args=--initialize-at-run-time=net.datafaker.service.RandomService
