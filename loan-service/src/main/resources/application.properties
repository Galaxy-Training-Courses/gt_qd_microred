quarkus.http.port=8082
quarkus.application.name=loan-service

quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=true

# Esquema versionado con Flyway, sin pasar por drop-and-create en producción
quarkus.flyway.migrate-at-start=true

# Sin datasource configurado en %dev/%test a propósito: Dev Services levanta
# PostgreSQL automáticamente (igual que community-service).
# %prod: cero credenciales literales, todo por variable de entorno.
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL}
%prod.quarkus.datasource.username=${DATABASE_USER}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD}

# REST Client Reactive hacia community-service. En %test lo sustituye la alternativa CDI
# CommunityStubAdapter.
quarkus.rest-client.community-api.url=http://localhost:8081
%prod.quarkus.rest-client.community-api.url=${COMMUNITY_SERVICE_URL}

# @Alternative de CDI: en %test las reglas de negocio se verifican contra
# hechos fijos de community (CommunityStubAdapter) en lugar de contra la red.
%test.quarkus.arc.selected-alternatives=pe.edu.galaxy.training.java.quarkus.loan.adapter.out.community.CommunityStubAdapter

# Canal de salida hacia Kafka.
# Sin bootstrap.servers en %dev/%test, Quarkus levanta Kafka Dev Services solo
# %prod usa Redpanda vía variable de entorno
mp.messaging.outgoing.loan-events.connector=smallrye-kafka
mp.messaging.outgoing.loan-events.topic=loan-events
mp.messaging.outgoing.loan-events.key.serializer=org.apache.kafka.common.serialization.LongSerializer
mp.messaging.outgoing.loan-events.value.serializer=pe.edu.galaxy.training.java.quarkus.loan.adapter.out.messaging.LoanEventSerializer

%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}

# Logs estructurados en JSON. `service` es estático por módulo;
# operation/requestId/loanId/status viajan por MDC (interceptor
# @BusinessOperation y RequestIdFilter)
quarkus.log.console.json.additional-field.service.value=loan-service

# Quitar metadatos innecesarios en el pintado de logs
quarkus.log.console.json.excluded-keys=sequence,loggerClassName,ndc,processName,processId,threadId

# Verificacion de JWT en create/approve/reject. Sin IdP real: loan-service solo verifica,
# nunca firma. publicKey.pem viaja en el jar en todos los perfiles (recurso
# publico, sin riesgo); la privada solo existe en src/test/resources, nunca
# empaquetada (ver TestJwt).
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://microred-lab.local/issuer
