# Solo para TestJwt.validToken() (Jwt.sign()
# usa esta ubicacion por defecto). Se combina con
# src/main/resources/application.properties (Quarkus superpone las claves
# de este archivo sobre ese, no lo reemplaza) - el resto de la configuracion
# de %test (Dev Services, Flyway, etc.) sigue viniendo de ahi.
smallrye.jwt.sign.key.location=privateKey.pem
